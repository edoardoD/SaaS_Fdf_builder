name: Build & Release Installers

# ─────────────────────────────────────────────────────────────
# Trigger:
#   - Push di un tag semver (es. v1.0.0, v2.1.3)
#   - Dispatch manuale dalla UI di GitHub (per test)
#
# Flusso:
#   1. Job "build" (matrix 3 SO) → compila + genera installer nativo + Fat JAR
#   2. Job "release" → scarica tutti gli artifact e crea GitHub Release
# ─────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────
  # JOB 1: Build nativo su ciascun SO
  # ───────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            artifact-path: desktopApp/build/compose/binaries/main/dmg/
            artifact-name: installer-macos

          - os: windows-latest
            task: packageMsi
            artifact-path: desktopApp/build/compose/binaries/main/msi/
            artifact-name: installer-windows

          - os: ubuntu-latest
            task: packageDeb
            artifact-path: desktopApp/build/compose/binaries/main/deb/
            artifact-name: installer-linux

    runs-on: ${{ matrix.os }}
    name: 📦 Build — ${{ matrix.os }}

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔧 Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: 🏗️ Build installer & UberJar
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :desktopApp:${{ matrix.task }} :desktopApp:packageUberJarForCurrentOS

      - name: 🔄 Rename UberJar
        shell: bash
        run: |
          # Rinomina il jar per includere il nome del sistema operativo
          # Questo evita conflitti quando si uniscono gli artifact e chiarisce quale jar usare
          cd desktopApp/build/compose/jars
          mv *.jar ManutenzioniMaker-${{ matrix.os }}.jar

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-path }}
            desktopApp/build/compose/jars/*.jar
          retention-days: 7
          if-no-files-found: error

  # ───────────────────────────────────────────────
  # JOB 2: Crea la GitHub Release con tutti gli installer
  # ───────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    name: 🚀 Release

    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers/
          merge-multiple: true

      - name: 📋 List artifacts
        run: |
          echo "=== Installer generati ==="
          find installers/ -type f | sort

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/**/*.dmg
            installers/**/*.msi
            installers/**/*.deb
            installers/**/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "Manutenzioni Maker ${{ github.ref_name }}"
          body: |
            ## 📦 Manutenzioni Maker ${{ github.ref_name }}

            ### Download
            | Piattaforma | Installer | Fat JAR (Portatile) |
            |---|---|---|
            | 🍎 macOS | `.dmg` | `ManutenzioniMaker-macos-latest.jar` |
            | 🪟 Windows | `.msi` | `ManutenzioniMaker-windows-latest.jar` |
            | 🐧 Linux | `.deb` | `ManutenzioniMaker-ubuntu-latest.jar` |

            ### Note sul Fat JAR
            I file `.jar` contengono tutte le dipendenze e sono utili se l'installer nativo ha problemi (es. crash su macOS per permessi/notarizzazione).
            Richiedono Java 17+ installato sul sistema.
            
            **Comando per avviare:**
            ```bash
            java -jar ManutenzioniMaker-macos-latest.jar
            ```

            ### Installazione
            - **macOS**: Apri il `.dmg` e trascina l'app in Applicazioni
            - **Windows**: Esegui il `.msi` e segui il wizard
            - **Linux**: `sudo dpkg -i manutenzioni-maker_*.deb`

            ---
            _Generato automaticamente da GitHub Actions_
