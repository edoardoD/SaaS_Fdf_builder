services:
  db:
    image: mongo:latest
    container_name: DesiderioDb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

  db-setup:
    image: mongo:latest
    depends_on:
      - db
    entrypoint: [ "bash", "-c", "sleep 5 && mongosh --host db:27017 --eval 'rs.initiate()'" ]

  service-kotlin:
    build:
      context: .
      dockerfile: ./service-kotlin/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set minio http://minio:9000 minioadmin minioadmin;
      mc mb minio/manutenzioni || true;
      mc anonymous set public minio/manutenzioni || true;
      "

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mongodb://db:27017/manutenzioni_maker?replicaSet=rs0
      - PDF_SERVICE_URL=http://service-kotlin:8080
      - S3_ENDPOINT=http://localhost:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_REGION=us-east-1
      - S3_BUCKET_NAME=manutenzioni
    depends_on:
      - db
      - service-kotlin
      - minio

volumes:
  mongo_data:
  minio_data:
