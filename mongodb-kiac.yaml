apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
        env:
        # Per l'ambiente di sviluppo in locale, non impostiamo password complesse.
        # Rimuovere queste env var in produzione per richiedere autenticazione.
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "root"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "password"
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
      volumes:
      - name: mongo-storage
        emptyDir: {} 
        # Nota: emptyDir perde i dati se il pod si riavvia. 
        # Per persistere i dati in KIAC tra i riavvii del Mac, scommentare la sezione sotto e usare hostPath o un PVC:
        # hostPath:
        #   path: /path/on/mac/to/save/db
        #   type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  type: NodePort
  selector:
    app: mongodb
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
    nodePort: 30017 # La porta che esporremo sul Mac (es. localhost:30017)
